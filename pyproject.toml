[project]
name = "p3-petz-witness"
version = "0.1.0"
description = "K0 exact oracles for the low-moment twirled-Petz recoverability witness (SEMANTICS.md, SKELETON.md)"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "cvxpy>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyrefly",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petz_witness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
